# ─────────────────────────────────────────────────────────────────────────────
# Optimized nginx for benchmarking static-file serving against fractal.
#
# Serves the same fractal.Playground/wwwroot, tuned for maximum throughput on a
# warm page cache over loopback — the conditions fractal is measured under. Runs
# entirely under this directory as an unprivileged user (no system service, no
# root, port 8081).
#
#   start:  ./run.sh                  (or: nginx -p "$PWD/" -c nginx.conf)
#   bench:  wrk -c512 -t12 -d10s http://127.0.0.1:8081/10kb.html
#   stop:   ./run.sh stop             (or: nginx -p "$PWD/" -c nginx.conf -s quit)
# ─────────────────────────────────────────────────────────────────────────────

worker_processes      12;          # one worker per core — matches fractal's 12 reactors
worker_cpu_affinity   auto;        # pin each worker to its own CPU (thread-per-core, like fractal)
worker_rlimit_nofile  65536;

error_log  /dev/null  crit;        # no error-log syscalls on the hot path
pid        nginx.pid;              # written under the -p prefix (this directory)

events {
    worker_connections  16384;
    use                 epoll;     # Linux event loop
    multi_accept        on;        # drain the whole accept queue per wakeup
}

http {
    # --- logging off: an access_log line is a write() syscall on every request ---
    access_log  off;

    # --- zero-copy file -> socket ---
    sendfile     on;               # serve straight from page cache, no user-space copy
    tcp_nopush   on;               # fill full packets (headers + file body) before sending
    tcp_nodelay  on;               # ...but flush the final short packet (keep-alive latency)

    # --- keep connections hot so wrk never churns them ---
    keepalive_timeout          300s;
    keepalive_requests         10000000;   # default 1000 would tear down conns mid-run
    reset_timedout_connection  on;

    # --- hold fds + metadata open, like fractal's pre-opened AssetCache ---
    # Once warm there is no open()/stat()/close() per request.
    open_file_cache          max=16384 inactive=600s;
    open_file_cache_valid    600s;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    # --- pre-compressed siblings (.gz), like fractal serves .br/.gz. wrk sends no
    #     Accept-Encoding, so it gets identity either way; this is only for browser parity. ---
    gzip_static  on;

    server_tokens off;

    types {
        text/html               html htm;
        text/css                css;
        application/javascript  js;
        application/json        json;
        image/svg+xml           svg;
        image/png               png;
        text/plain              txt;
    }
    default_type  application/octet-stream;

    server {
        # SO_REUSEPORT: a separate accept queue per worker, kernel-load-balanced —
        # no accept-mutex contention (the same model as fractal's SO_REUSEPORT listeners).
        listen       8081 reuseport deferred backlog=65535;
        server_name  _;

        root  /home/diogo/Desktop/Socket/fractal/fractal.Playground/wwwroot;

        location / {
            index  index.html;
        }
    }
}
